androidLint = { id = "com.android.lint", version.ref = "agp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

kmp-library-plugin = { id = "dev.cmpose.app.kmp.library", version = "unspecified" }
compose-multiplatform-plugin = { id = "dev.cmpose.app.compose.multiplatform", version = "unspecified" }
multiplatform-application-plugin = { id = "dev.cmpose.app.multiplatformApplication", version = "unspecified" }
feature-contract-plugin = { id = "dev.cmpose.app.feature.contract", version = "unspecified" }
feature-data-plugin = { id = "dev.cmpose.app.feature.data", version = "unspecified" }
feature-domain-plugin = { id = "dev.cmpose.app.feature.domain", version = "unspecified" }
feature-presentation-plugin = { id = "dev.cmpose.app.feature.presentation", version = "unspecified" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }